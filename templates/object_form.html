{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card">
            <div class="card-body">
                <h1 class="card-title mb-4">{{ title }}</h1>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="btn-list">
                        <button class="btn btn-primary" type="submit">Сохранить</button>
                        <a class="btn btn-link" href="javascript:history.back()">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
